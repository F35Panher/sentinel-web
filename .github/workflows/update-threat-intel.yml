name: Update Sentinel Threat Intelligence

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sentinel-threat-intel-update
  cancel-in-progress: false

jobs:
  update-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-package-lock
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Check URLhaus configuration
        env:
          URLHAUS_AUTH_KEY: ${{ secrets.URLHAUS_AUTH_KEY }}
        run: |
          if [ -z "$URLHAUS_AUTH_KEY" ]; then
            echo "::error::URLHAUS_AUTH_KEY is missing from GitHub Actions secrets."
            exit 1
          fi
          echo "URLhaus API key is configured."

      - name: Generate threat intelligence
        run: npm run intel:update
        env:
          URLHAUS_AUTH_KEY: ${{ secrets.URLHAUS_AUTH_KEY }}

      - name: Validate generated dataset
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const path = "public/intel/threat-intel.json";
          const data = JSON.parse(readFileSync(path, "utf8"));

          console.log("Dataset status:", data.status);
          console.log("Dataset version:", data.version);
          console.log("Sources:", data.sources?.length ?? 0);
          console.log("Indicators:", data.indicators?.length ?? 0);

          if (
            data.schemaVersion !== 1 ||
            data.status !== "ready" ||
            !Array.isArray(data.sources) ||
            data.sources.length === 0 ||
            !Array.isArray(data.indicators) ||
            data.indicators.length === 0
          ) {
            throw new Error(
              "Generated threat-intelligence dataset is not ready."
            );
          }
          NODE

      - name: Build project
        run: npm run build

      - name: Commit updated intelligence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/intel/threat-intel.json

          if git diff --cached --quiet; then
            echo "No threat intelligence changes to commit."
            exit 0
          fi

          git commit -m "chore: update threat intelligence"
          git push origin HEAD:main