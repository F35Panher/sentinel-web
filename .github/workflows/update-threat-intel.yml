name: Update Sentinel Threat Intelligence

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sentinel-threat-intel-update
  cancel-in-progress: false

jobs:
  update-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-package-lock
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Generate threat intelligence
        run: npm run intel:update
        env:
          URLHAUS_AUTH_KEY: ${{ secrets.URLHAUS_AUTH_KEY }}

      - name: Build project
        run: npm run build

      - name: Commit updated intelligence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/intel/threat-intel.json

          if git diff --cached --quiet; then
            echo "No threat intelligence changes to commit."
            exit 0
          fi

          git commit -m "chore: update threat intelligence"
          git push origin HEAD:main